# Builds lenormand-witch.zip and attaches it to a GitHub Release.
# Runs when a release is published. It can also run by hand (Actions → Release zip → Run workflow):
#   new tag:      run it from a branch; it creates the tag and the release at that branch's head.
#   existing tag: run it from that tag (Use workflow from → Tags); it rebuilds the zip of that release.
name: Release zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.1.0). A new tag is created at the head of the branch you run from.
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # A release event checks out the tagged commit; a manual run checks out the branch or tag it runs from.
      - name: Check out
        uses: actions/checkout@v5
        with:
          path: lenormand-witch

      - name: Check the tag
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ] && git -C lenormand-witch ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG already exists. Run the workflow from that tag (Use workflow from → Tags → $TAG)."
            exit 1
          fi

      - name: Build the zip
        run: |
          zip -qr lenormand-witch.zip lenormand-witch \
            -x 'lenormand-witch/.git/*' 'lenormand-witch/.github/*' \
               'lenormand-witch/.claude-plugin/*' 'lenormand-witch/README.md'
          unzip -l lenormand-witch.zip

      - name: Check the zip
        run: |
          unzip -q lenormand-witch.zip -d check
          test -f check/lenormand-witch/SKILL.md
          python3 check/lenormand-witch/scripts/render_reading.py \
            check/lenormand-witch/assets/example-square9.json check/page.html

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" lenormand-witch.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" lenormand-witch.zip --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
