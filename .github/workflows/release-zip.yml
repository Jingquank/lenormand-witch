# Builds lenormand-witch.zip and attaches it to a GitHub Release.
# Runs when a release is published, or by hand (Actions → Release zip → Run workflow) for a pushed tag.
# A manual run creates the release for that tag when none exists yet.
name: Release zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build the zip for (for example v1.1.0); its release is created if missing
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          path: lenormand-witch

      - name: Build the zip
        run: |
          zip -qr lenormand-witch.zip lenormand-witch \
            -x 'lenormand-witch/.git/*' 'lenormand-witch/.github/*' \
               'lenormand-witch/.claude-plugin/*' 'lenormand-witch/README.md'
          unzip -l lenormand-witch.zip

      - name: Check the zip
        run: |
          unzip -q lenormand-witch.zip -d check
          test -f check/lenormand-witch/SKILL.md
          python3 check/lenormand-witch/scripts/render_reading.py \
            check/lenormand-witch/assets/example-square9.json check/page.html

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" lenormand-witch.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" lenormand-witch.zip --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes --verify-tag
          fi
